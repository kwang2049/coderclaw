[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coderclaw"
version = "0.1.0"
description = "Local-first agentic coding system with Slack as the first communication channel."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
coderclaw = "coderclaw.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
